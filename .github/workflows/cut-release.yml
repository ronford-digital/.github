# Cut a release of a release train WITHOUT rebuilding anything.
#
# Takes the images CI already built, scanned and deployed to UAT for one commit,
# gives them the train's next CalVer tag (same digest -- a registry-side retag),
# then creates the git tag <train>/v<version> and a GitHub Release with
# generated notes and the digest of every image.
#
# Called from each product repo's .github/workflows/cut-release.yml. The train
# is described by the caller's .github/release-train.json:
#
#   {
#     "train": "momo",
#     "tag_prefix": "momo/v",
#     "legacy_prefixes": "",                 # optional, cut-over only
#     "ci_tag": "{branch}-{sha8}",           # how CI tags a commit's images
#     "images": [
#       { "name": "knpdts-core-api",          # image name in the client registry
#         "source": "ghcr.io/ronford-digital/backend-knpdts-momo-service/knpdts-core-api" }
#     ]
#   }
#
# See devops-rddev-big-picture: 06 Deployment Standards.
name: Cut release (reusable)

on:
  workflow_call:
    inputs:
      commit:
        description: >
          Full commit SHA to release (default: the head of the dispatched branch).
          Pass the commit that has been running in UAT, not whatever landed since.
        type: string
        default: ""
      channel:
        description: "stable -> 2026.10.23, rc -> 2026.10.23-rc.1"
        type: string
        default: stable
      config:
        description: Path to the release train config in the caller repo.
        type: string
        default: .github/release-train.json
    secrets:
      registry-username:
        description: Username for ghcr.io/ronford-digital (default github.actor).
        required: false
      registry-token:
        description: Token with packages read+write on the train's images (default GITHUB_TOKEN).
        required: false
    outputs:
      version:
        description: The released version.
        value: ${{ jobs.cut-release.outputs.version }}
      tag:
        description: The git tag created.
        value: ${{ jobs.cut-release.outputs.tag }}

permissions:
  contents: write
  packages: write

concurrency:
  # Two cuts of the same train at once would compute the same version.
  group: cut-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cut-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.calver.outputs.version }}
      tag: ${{ steps.calver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Read train config
        id: config
        env:
          CONFIG: ${{ inputs.config }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT_INPUT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ -f "$CONFIG" ]] || { echo "::error::$CONFIG not found"; exit 1; }
          if ! jq -e '
              ([.train, .tag_prefix, .ci_tag] | all(type == "string" and length > 0))
              and (.images | type == "array" and length > 0)
              and (.images | all((.name | type == "string" and length > 0)
                             and (.source | type == "string" and length > 0)))' "$CONFIG" >/dev/null; then
            echo "::error::$CONFIG must set train, tag_prefix, ci_tag and a non-empty images[] of {name, source}"
            exit 1
          fi
          case "$CHANNEL" in
            stable) PRERELEASE="" ;;
            rc)     PRERELEASE="rc" ;;
            *) echo "::error::channel must be stable or rc, got '$CHANNEL'"; exit 1 ;;
          esac

          COMMIT="${COMMIT_INPUT:-$GITHUB_SHA}"
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a FULL 40-character SHA, got '$COMMIT'"
            exit 1
          fi
          # Only release commits that are actually on the dispatched branch --
          # that is the branch CI built and deployed them from.
          if ! git merge-base --is-ancestor "$COMMIT" "$GITHUB_SHA"; then
            echo "::error::$COMMIT is not on ${GITHUB_REF_NAME}"
            exit 1
          fi

          SHA8="${COMMIT:0:8}"
          CI_TAG=$(jq -r '.ci_tag' "$CONFIG")
          CI_TAG="${CI_TAG//\{branch\}/$GITHUB_REF_NAME}"
          CI_TAG="${CI_TAG//\{sha8\}/$SHA8}"
          # build-image (metadata-action) pushes the tag sanitised this way, so
          # e.g. branch release/pilot is tagged release-pilot-<sha8>.
          CI_TAG="$(sed -E 's/[^a-zA-Z0-9._-]+/-/g' <<< "$CI_TAG")"

          {
            echo "train=$(jq -r '.train' "$CONFIG")"
            echo "tag-prefix=$(jq -r '.tag_prefix' "$CONFIG")"
            echo "legacy-prefixes=$(jq -r '.legacy_prefixes // ""' "$CONFIG")"
            echo "prerelease=$PRERELEASE"
            echo "commit=$COMMIT"
            echo "ci-tag=$CI_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: calver
        uses: ronford-digital/.github/actions/next-calver@v1
        with:
          tag-prefix: ${{ steps.config.outputs.tag-prefix }}
          legacy-prefixes: ${{ steps.config.outputs.legacy-prefixes }}
          prerelease: ${{ steps.config.outputs.prerelease }}

      # Resolve every image to a digest and check its provenance BEFORE any
      # version tag is written. Version tags are immutable, so a failure after
      # tagging would leave orphan tags that block a corrected retry.
      - name: Resolve and verify the tested images
        id: resolve
        env:
          CONFIG: ${{ inputs.config }}
          CI_TAG: ${{ steps.config.outputs.ci-tag }}
          COMMIT: ${{ steps.config.outputs.commit }}
          PREVIOUS_TAG: ${{ steps.calver.outputs.previous-tag }}
          REG_USER: ${{ secrets.registry-username || github.actor }}
          REG_PASS: ${{ secrets.registry-token || github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$REG_PASS" | skopeo login -u "$REG_USER" --password-stdin ghcr.io >/dev/null
          sources=$(jq -r '.images[].source' "$CONFIG")
          resolved=""
          selection='[]'
          failed=0
          ci_tag_template=$(jq -r '.ci_tag' "$CONFIG")
          ci_tag_template="${ci_tag_template//\{branch\}/$GITHUB_REF_NAME}"

          ci_tag_for_commit() {
            local commit_sha="$1"
            local tag="${ci_tag_template//\{sha8\}/${commit_sha:0:8}}"
            sed -E 's/[^a-zA-Z0-9._-]+/-/g' <<< "$tag"
          }

          resolve_ancestor_ref() {
            local source="$1"
            local range_start="$2"
            local candidate_commit=""
            local candidate_tag=""
            local sum=""
            local ref=""
            local rev=""

            while read -r candidate_commit; do
              [[ -z "$candidate_commit" || "$candidate_commit" == "$COMMIT" ]] && continue
              candidate_tag="$(ci_tag_for_commit "$candidate_commit")"
              [[ "$candidate_tag" == "$CI_TAG" ]] && continue

              if sum=$(skopeo inspect --raw "docker://${source}:${candidate_tag}" 2>/dev/null | sha256sum); then
                ref="${source}@sha256:${sum%% *}"
                rev=$(skopeo inspect --config "docker://$ref" | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')
                if [[ -n "$rev" && "$rev" != "$candidate_commit" ]]; then
                  echo "::warning::Ignoring ${source}:${candidate_tag}; revision label is ${rev}, expected ${candidate_commit}." >&2
                  continue
                fi
                printf '%s\n' "$ref"
                return 0
              fi
            done < <(git rev-list --first-parent "$COMMIT" "^${range_start}")

            return 1
          }

          previous_release_json=""
          previous_release_revision=""
          if [[ -n "$PREVIOUS_TAG" ]]; then
            work_dir="$RUNNER_TEMP/cut-release"
            mkdir -p "$work_dir"
            if gh release download "$PREVIOUS_TAG" --pattern release.json --dir "$work_dir" --clobber >/dev/null 2>&1; then
              previous_revision=$(jq -r '.source.revision // empty' "$work_dir/release.json")
              if [[ "$previous_revision" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$previous_revision" "$COMMIT"; then
                previous_release_json="$work_dir/release.json"
                previous_release_revision="$previous_revision"
              else
                echo "::warning::Release ${PREVIOUS_TAG} has no compatible ancestor revision for ${COMMIT}; fallback to previous release digests is disabled."
              fi
            else
              echo "::warning::Could not download release.json from ${PREVIOUS_TAG}; fallback to previous release digests is disabled."
            fi
          fi

          for SOURCE in $sources; do
            mode="ci-tag"
            ref=""
            inspect_error_file=$(mktemp)
            # Hash the raw manifest stream (the index the cluster pulls).
            if sum=$(skopeo inspect --raw "docker://${SOURCE}:${CI_TAG}" 2>"$inspect_error_file" | sha256sum); then
              ref="${SOURCE}@sha256:${sum%% *}"
              rev=$(skopeo inspect --config "docker://$ref" \
                | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')
              if [[ -z "$rev" ]]; then
                # Images built before the OCI-label change carry no revision label;
                # the CI tag (which embeds the sha) is the only link we have.
                echo "::warning::${SOURCE}:${CI_TAG} has no org.opencontainers.image.revision label (built before the labelling change)"
              elif [[ "$rev" != "$COMMIT" ]]; then
                echo "::error::${SOURCE}:${CI_TAG} was built from $rev, not $COMMIT"
                failed=1
                rm -f "$inspect_error_file"
                continue
              fi
            else
              inspect_error=$(cat "$inspect_error_file")
              if [[ -n "$previous_release_json" ]] && grep -qiE 'manifest unknown|not found|name unknown' <<< "$inspect_error"; then
                if [[ -n "$previous_release_revision" ]]; then
                  if ancestor_ref=$(resolve_ancestor_ref "$SOURCE" "$previous_release_revision"); then
                    ref="$ancestor_ref"
                    mode="ancestor-ci-tag"
                    echo "::notice::Reusing ${ref} from the latest ancestor CI tag."
                  fi
                fi

                if [[ -z "$ref" ]]; then
                  digest=$(jq -r --arg source "$SOURCE" '.images[] | select(.image == $source) | .digest' "$previous_release_json" | head -n1)
                  if [[ -z "$digest" || "$digest" == "null" ]]; then
                    echo "::error::${SOURCE}:${CI_TAG} does not exist and no digest for ${SOURCE} was found in ${PREVIOUS_TAG} release.json"
                    failed=1
                    rm -f "$inspect_error_file"
                    continue
                  fi
                  ref="${SOURCE}@${digest}"
                  if ! skopeo inspect --config "docker://$ref" >/dev/null 2>&1; then
                    echo "::error::Fallback digest ${ref} from ${PREVIOUS_TAG} could not be inspected"
                    failed=1
                    rm -f "$inspect_error_file"
                    continue
                  fi
                  mode="previous-release"
                  echo "::notice::Reusing ${ref} from ${PREVIOUS_TAG} (no newer ancestor CI tag found)."
                fi
              else
                echo "::error::Could not inspect ${SOURCE}:${CI_TAG}: ${inspect_error}"
                failed=1
                rm -f "$inspect_error_file"
                continue
              fi
            fi
            rm -f "$inspect_error_file"
            echo "resolved ${SOURCE} -> $ref (${mode})"
            resolved+="${ref}"$'\n'
            selection=$(jq -c --arg image "$SOURCE" --arg mode "$mode" --arg ref "$ref" '
              . + [{image: $image, selection: $mode, source_ref: $ref}]
            ' <<< "$selection")
          done
          (( failed == 0 )) || exit 1
          {
            echo "images<<__EOF__"
            printf '%s' "$resolved"
            echo "__EOF__"
            echo "selection=$selection"
          } >> "$GITHUB_OUTPUT"

      - name: List retags
        id: pairs
        env:
          RESOLVED: ${{ steps.resolve.outputs.images }}
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "images<<__EOF__"
            while read -r ref; do
              [[ -n "$ref" ]] && echo "${ref} ${ref%@*}:${VERSION}"
            done <<< "$RESOLVED"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # Same registry on both sides: this is a retag of the verified digest.
      - name: Tag the tested images with the release version
        id: copy
        uses: ronford-digital/.github/actions/copy-image@v1
        with:
          images: ${{ steps.pairs.outputs.images }}
          source-username: ${{ secrets.registry-username || github.actor }}
          source-password: ${{ secrets.registry-token || github.token }}
          destination-username: ${{ secrets.registry-username || github.actor }}
          destination-password: ${{ secrets.registry-token || github.token }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.calver.outputs.tag }}
          VERSION: ${{ steps.calver.outputs.version }}
          PREVIOUS: ${{ steps.calver.outputs.previous-tag }}
          COMMIT: ${{ steps.config.outputs.commit }}
          CI_TAG: ${{ steps.config.outputs.ci-tag }}
          TRAIN: ${{ steps.config.outputs.train }}
          CHANNEL: ${{ inputs.channel }}
          DIGESTS: ${{ steps.copy.outputs.digests }}
          SELECTION: ${{ steps.resolve.outputs.selection }}
        run: |
          set -euo pipefail
          jq -n \
            --arg train "$TRAIN" --arg version "$VERSION" --arg channel "$CHANNEL" \
            --arg repo "$GITHUB_REPOSITORY" --arg revision "$COMMIT" --arg git_tag "$TAG" \
            --arg ci_tag "$CI_TAG" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg released_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson digests "$DIGESTS" --argjson selection "$SELECTION" \
            '{train: $train, version: $version, channel: $channel, released_at: $released_at,
              source: {repo: $repo, revision: $revision, git_tag: $git_tag, ci_tag: $ci_tag},
              build_run: $run,
              selection: $selection,
              images: ($digests | to_entries | map({image: (.key | sub(":[^:/]+$"; "")), tag: $version, digest: .value}))}' \
            > release.json

          {
            echo "## Images"
            echo ""
            echo "Images with CI tag \`${CI_TAG}\` were taken from this commit; services with no CI tag reuse"
            echo "their digest from \`${PREVIOUS}\`. All were tagged \`${VERSION}\` **without rebuilding**."
            echo ""
            echo "| Image | Digest | Source |"
            echo "|---|---|---|"
            jq -r '.images[] as $image
              | (.selection[] | select(.image == $image.image) | .selection) as $source
              | "| `\($image.image):\($image.tag)` | `\($image.digest)` | `\($source // "ci-tag")` |"' release.json
            echo ""
          } > notes.md

          ARGS=(--title "${TRAIN} ${VERSION}" --target "$COMMIT" --notes-file notes.md --generate-notes)
          [[ -n "$PREVIOUS" ]] && ARGS+=(--notes-start-tag "$PREVIOUS")
          [[ "$CHANNEL" == "rc" ]] && ARGS+=(--prerelease)
          gh release create "$TAG" "${ARGS[@]}"
          gh release upload "$TAG" release.json

          {
            echo "## 🚂 ${TRAIN} ${VERSION} (${CHANNEL})"
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"
